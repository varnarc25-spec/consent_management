# Inline Cloud Build — consent-management-admin
# Paste into: Cloud Build → Triggers → Admin trigger → Open editor
# Set _AUTH0_DOMAIN and _AUTH0_CLIENT_ID in trigger substitutions

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--no-cache'
      - '-t'
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - '-f'
      - docker/Dockerfile.admin
      - '--build-arg'
      - NEXT_PUBLIC_API_URL=https://consent-management-api-414895350436.us-central1.run.app/api/v1
      - '--build-arg'
      - AUTH0_DOMAIN=${_AUTH0_DOMAIN}
      - .
    id: Build
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - '--region=$_DEPLOY_REGION'
      - '--port=8080'
      - >-
        --set-env-vars=NODE_ENV=production,APP_BASE_URL=https://consent-management-admin-414895350436.us-central1.run.app,AUTH0_DOMAIN=${_AUTH0_DOMAIN},AUTH0_CLIENT_ID=${_AUTH0_CLIENT_ID},NEXT_PUBLIC_AUTH0_DOMAIN=${_AUTH0_DOMAIN}
      - >-
        --set-secrets=AUTH0_CLIENT_SECRET=AUTH0_CLIENT_SECRET:latest,AUTH0_SECRET=AUTH0_SECRET:latest
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--quiet'
    id: Deploy
    entrypoint: gcloud
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _AUTH0_DOMAIN: your-tenant.us.auth0.com
  _AUTH0_CLIENT_ID: your-auth0-client-id
