# Cloud Build for consent-management-web (Cloud Run GitHub deploy trigger).
# In GCP Console: Configuration → Cloud Build configuration file → Repository → cloudbuild.web.yaml

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - '--no-cache'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '-f'
      - docker/Dockerfile.web
      - '--build-arg'
      - NEXT_PUBLIC_ADMIN_URL=${_ADMIN_URL}
      - '--build-arg'
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - '--build-arg'
      - NEXT_PUBLIC_AUTH0_CONFIGURED=true
      - '--build-arg'
      - AUTH0_DOMAIN=${_AUTH0_DOMAIN}
      - '--build-arg'
      - AUTH0_AUDIENCE=${_AUTH0_AUDIENCE}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_DEPLOY_REGION'
      - '--port=8080'
      - '--startup-probe=initialDelaySeconds=20,timeoutSeconds=5,periodSeconds=10,failureThreshold=12,httpGet.path=/,httpGet.port=8080'
      - '--set-env-vars=NODE_ENV=production,APP_BASE_URL=${_WEB_URL},AUTH0_DOMAIN=${_AUTH0_DOMAIN},NEXT_PUBLIC_AUTH0_DOMAIN=${_AUTH0_DOMAIN},AUTH0_AUDIENCE=${_AUTH0_AUDIENCE},API_URL=${_API_URL},NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_ADMIN_URL=${_ADMIN_URL},NEXT_PUBLIC_AUTH0_CONFIGURED=true'
      - '--set-secrets=CM_AUTH0_CLIENT_ID=CM_AUTH0_CLIENT_ID:latest,cm_auth0_client_secret=cm_auth0_client_secret:latest,AUTH0_SECRET=AUTH0_SECRET:latest'
      - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID'
      - '--quiet'

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _WEB_URL: https://consent-management-web-414895350436.us-central1.run.app
  _ADMIN_URL: https://consent-management-admin-414895350436.us-central1.run.app
  _API_URL: https://consent-management-api-414895350436.us-central1.run.app/api/v1
  _AUTH0_DOMAIN: dev-varnarc.us.auth0.com
  _AUTH0_AUDIENCE: https://api.consent-management.varnarc.com
